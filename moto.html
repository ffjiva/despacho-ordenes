<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Portal Motorista</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root {
  --bg: #f2f0eb;
  --surface: #ffffff;
  --surface2: #faf9f7;
  --border: #dddbd2;
  --border2: #e8e6df;
  --text: #18180f;
  --text2: #5a5a4f;
  --muted: #8a8a7e;
  --accent: #18180f;
  --accent2: #2d5a1b;
  --done-bg: #edf5e1;
  --done-bd: #bad48a;
  --done-tx: #2d5a1b;
  --warn-bg: #fdf4e3;
  --warn-bd: #f0cc7a;
  --warn-tx: #7a4f0a;
  --err-bg: #fdecea;
  --err-bd: #f5b8b2;
  --err-tx: #9b2a20;
  --info-bg: #e8f0fb;
  --info-bd: #a8c4f0;
  --info-tx: #1c4fa0;
  --mono: 'IBM Plex Mono', monospace;
  --r: 6px;
  --r2: 10px;
}
body.dark {
  --bg: #1a1a1a;
  --surface: #2a2a2a;
  --surface2: #242424;
  --border: #3a3a3a;
  --border2: #303030;
  --text: #e8e6df;
  --text2: #a8a69e;
  --muted: #6a6a5e;
  --done-bg: #1a2e12; --done-bd: #3a6424; --done-tx: #7ab84a;
  --warn-bg: #2a2212; --warn-bd: #6a5418; --warn-tx: #d0a030;
  --err-bg:  #2a1212; --err-bd:  #6a2424; --err-tx:  #e06868;
  --info-bg: #121a2a; --info-bd: #264472; --info-tx: #6090d8;
}
body.dark .fld select { background: #222; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

.scr { display: none; min-height: 100vh; }
.scr.on { display: block; }

/* ── LOGIN ── */
.login-wrap {
  max-width: 400px; margin: 0 auto;
  padding: 3rem 1.25rem 3rem;
  display: flex; flex-direction: column; align-items: center;
}
.login-logo {
  width: 64px; height: 64px; background: var(--accent); color: #fff;
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; margin-bottom: 1.25rem;
}
.login-h   { font-size: 1.1rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: .3rem; text-align: center; }
.login-sub { font-size: .75rem; color: var(--text2); text-align: center; margin-bottom: 1.75rem; line-height: 1.7; }
.login-form { width: 100%; }

/* ── FORM ── */
.fld { margin-bottom: .9rem; }
.fld label { display: block; font-size: .6rem; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.fld select {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: var(--r);
  font-family: var(--mono); font-size: .82rem;
  background: var(--surface); color: var(--text);
  outline: none; transition: border-color .15s;
}
.fld select:focus { border-color: var(--accent); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 14px 18px; border-radius: var(--r);
  font-family: var(--mono); font-size: .78rem; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
  cursor: pointer; border: none; transition: all .15s;
  white-space: nowrap; min-height: 48px;
}
.btn:active { transform: scale(.97); }
.btn-dark    { background: var(--accent); color: #fff; width: 100%; }
.btn-dark:hover { background: #2c2c22; }
.btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-warn    { background: var(--warn-bg); color: var(--warn-tx); border: 1px solid var(--warn-bd); width: 100%; font-size: .85rem; }
.btn-done-action { background: var(--done-bg); color: var(--done-tx); border: 1px solid var(--done-bd); width: 100%; font-size: .85rem; }

/* ── NOTICE BOXES ── */
.box-err { background: var(--err-bg); border: 1px solid var(--err-bd); color: var(--err-tx); padding: 10px 12px; border-radius: var(--r); font-size: .72rem; }

/* ── SPINNER ── */
.spin {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(0,0,0,.1); border-top-color: currentColor;
  border-radius: 50%; animation: rot .65s linear infinite; vertical-align: middle; margin-right: 6px;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* ── HEADER ── */
.m-header {
  background: var(--accent); color: #fff;
  padding: 1rem 1rem .9rem;
  position: sticky; top: 0; z-index: 100;
}
.m-header-top { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
.m-name { font-size: .9rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.m-date { font-size: .6rem; opacity: .6; letter-spacing: .05em; text-transform: uppercase; margin-top: 3px; }
.m-logout {
  background: transparent; border: 1px solid rgba(255,255,255,.3);
  color: rgba(255,255,255,.85); font-family: var(--mono); font-size: .6rem;
  font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 7px 12px; border-radius: var(--r); cursor: pointer; flex-shrink: 0;
  min-height: 36px;
}

/* ── STATS BAR ── */
.m-stats {
  display: flex; background: var(--surface);
  border-bottom: 1px solid var(--border2);
}
.m-stat {
  flex: 1; padding: .7rem .5rem; text-align: center;
  border-right: 1px solid var(--border2);
}
.m-stat:last-child { border-right: none; }
.m-stat-num { font-size: 1.3rem; font-weight: 700; }
.m-stat-lbl { font-size: .52rem; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }

/* ── VUELTA CARDS ── */
.m-list { padding: .75rem .875rem 4rem; max-width: 600px; margin: 0 auto; }
.mcard {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); margin-bottom: 10px; overflow: hidden;
}
.mcard.mc-camino { border-color: var(--warn-bd); border-left: 4px solid var(--warn-tx); }
.mcard.mc-done   { background: var(--done-bg); border-color: var(--done-bd); }
@keyframes pulse-border {
  0%, 100% { border-top-color: #ff3b30; }
  50%       { border-top-color: rgba(255,59,48,.3); }
}
.mcard.emergency {
  background: var(--err-bg);
  border-top: 3px solid #ff3b30;
  animation: pulse-border .8s ease-in-out infinite;
}
.emergency-bar {
  background: #ff3b30; color: #fff;
  font-size: .7rem; font-weight: 700; text-align: center;
  padding: 8px; letter-spacing: .05em;
}

.mcard-top { display: flex; align-items: flex-start; gap: 12px; padding: 14px 14px 10px; }
.m-order-circle {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 700;
  background: var(--border2); color: var(--muted);
}
.m-order-circle.mc-camino { background: var(--warn-tx); color: #fff; }
.m-order-circle.mc-done   { background: var(--done-tx); color: #fff; }

.mcard-info { flex: 1; min-width: 0; }
.mcard-dest {
  font-size: 1rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .03em; color: var(--text); line-height: 1.3;
}
.mcard.mc-done .mcard-dest { color: var(--done-tx); }
.mcard-desc { font-size: .75rem; color: var(--text2); margin-top: 4px; line-height: 1.45; }
.mcard-done-time { font-size: .68rem; color: var(--done-tx); margin-top: 6px; }
.btn-undo {
  font-family: var(--mono); font-size: .62rem; color: var(--muted);
  background: transparent; border: 1px solid var(--border2);
  border-radius: var(--r); padding: 5px 10px; cursor: pointer;
  margin-top: 6px; display: inline-block;
}
/* ── FILTER BAR ── */
.m-filter-bar {
  display: flex; gap: 6px; padding: .6rem .875rem;
  background: var(--surface); border-bottom: 1px solid var(--border2);
  overflow-x: auto;
}
.m-filter-bar::-webkit-scrollbar { display: none; }
.m-fbtn {
  padding: 4px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  font-family: var(--mono); font-size: .65rem;
  cursor: pointer; white-space: nowrap; color: var(--muted);
  letter-spacing: .04em; transition: all .15s;
}
.m-fbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.mcard-yendo {
  font-size: .75rem; color: var(--warn-tx); font-weight: 600;
  padding: 0 14px 6px 62px;
}

.mcard-actions { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.photo-strip { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 6px; }
.photo-thumb { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); }
.btn-foto {
  font-family: var(--mono); font-size: .72rem; font-weight: 600;
  background: var(--info-bg); color: var(--info-tx); border: 1px solid var(--info-bd);
  border-radius: var(--r); padding: 8px 14px; cursor: pointer;
  margin: 0 12px 10px; display: block; width: calc(100% - 24px);
  min-height: 40px;
}
.btn-foto:disabled { opacity: .45; cursor: not-allowed; }

.empty-state { text-align: center; padding: 3rem 1rem 2rem; color: var(--muted); }
.empty-icon  { font-size: 2.5rem; opacity: .3; margin-bottom: .75rem; }
.empty-text  { font-size: .8rem; line-height: 1.7; }
/* ── PIN LOGIN ── */
.moto-user-btn {
  width: 100%; padding: 16px 18px; border-radius: var(--r);
  border: 2px solid var(--border); background: var(--surface);
  font-family: var(--mono); font-size: .9rem; font-weight: 600;
  color: var(--text); text-align: left; cursor: pointer;
  margin-bottom: 10px; transition: all .15s; display: block;
}
.moto-user-btn:active, .moto-user-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.pin-keypad {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; max-width: 300px; margin: 0 auto 1rem;
}
.pin-key {
  aspect-ratio: 1; border-radius: var(--r2);
  border: 1px solid var(--border); background: var(--surface);
  font-family: var(--mono); font-size: 1.5rem; font-weight: 700;
  color: var(--text); cursor: pointer; transition: all .1s;
  display: flex; align-items: center; justify-content: center;
  min-height: 72px;
}
.pin-key:active { background: var(--accent); color: #fff; transform: scale(.94); }
.pin-key-enter  { background: var(--accent); color: #fff; font-size: 1.2rem; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: .75rem 0 1.25rem; }
.pin-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--border); transition: all .15s;
}
.pin-dot.filled { background: var(--accent); border-color: var(--accent); }
body.dark .pin-key { background: var(--surface2); }
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="s-login" class="scr on">
  <div class="login-wrap">
    <div class="login-logo">🚐</div>
    <div class="login-h">Portal Motorista</div>
    <div class="login-sub" id="moto-pin-sub">Selecciona tu nombre para continuar.</div>

    <div id="moto-user-list" style="width:100%"></div>

    <div id="moto-pin-entry" style="display:none;width:100%">
      <div class="pin-dots" id="moto-pin-dots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>
      <div class="pin-keypad">
        <button class="pin-key" onclick="mPinKey('1')">1</button>
        <button class="pin-key" onclick="mPinKey('2')">2</button>
        <button class="pin-key" onclick="mPinKey('3')">3</button>
        <button class="pin-key" onclick="mPinKey('4')">4</button>
        <button class="pin-key" onclick="mPinKey('5')">5</button>
        <button class="pin-key" onclick="mPinKey('6')">6</button>
        <button class="pin-key" onclick="mPinKey('7')">7</button>
        <button class="pin-key" onclick="mPinKey('8')">8</button>
        <button class="pin-key" onclick="mPinKey('9')">9</button>
        <button class="pin-key" onclick="mPinBackspace()">⌫</button>
        <button class="pin-key" onclick="mPinKey('0')">0</button>
        <button class="pin-key pin-key-enter" onclick="mDoPinLogin()">✓</button>
      </div>
      <div id="moto-login-err" class="box-err" style="display:none;text-align:center;margin-bottom:.75rem"></div>
      <button class="btn btn-outline" style="width:100%;margin-top:.25rem;font-size:.72rem" onclick="mBackToUsers()">← Cambiar usuario</button>
    </div>
  </div>
</div>

<!-- ══════════════ HOME ══════════════ -->
<div id="s-home" class="scr">
  <div class="m-header">
    <div class="m-header-top">
      <div>
        <div class="m-name" id="m-name-lbl">—</div>
        <div class="m-date" id="m-date-lbl"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="m-logout" id="theme-btn" onclick="toggleDark()" title="Modo oscuro">🌙</button>
        <button class="m-logout" onclick="doLogout()">Salir</button>
      </div>
    </div>
  </div>

  <div class="m-stats" id="m-stats">
    <div class="m-stat"><div class="m-stat-num">—</div><div class="m-stat-lbl">Total</div></div>
    <div class="m-stat"><div class="m-stat-num">—</div><div class="m-stat-lbl">Hechas</div></div>
    <div class="m-stat"><div class="m-stat-num">—%</div><div class="m-stat-lbl">Completado</div></div>
  </div>

  <div class="m-filter-bar">
    <button class="m-fbtn on" onclick="setMotoFilter('all',this)">Todas</button>
    <button class="m-fbtn"    onclick="setMotoFilter('pending',this)">Pendientes</button>
    <button class="m-fbtn"    onclick="setMotoFilter('done',this)">Completadas</button>
  </div>

  <div class="m-list" id="m-list">
    <div class="empty-state"><span class="spin"></span></div>
  </div>
</div>

<script type="module">
/* ═══════════════════════════════════
   CONFIG & STATE
═══════════════════════════════════ */
const FIREBASE_CFG = {
  apiKey: "AIzaSyAb_0e8Hh_UfzN54S3VZGQXqUD3t53bWrQ",
  authDomain: "despacho-ordenes.firebaseapp.com",
  projectId: "despacho-ordenes",
  storageBucket: "despacho-ordenes.firebasestorage.app",
  messagingSenderId: "694628838838",
  appId: "1:694628838838:web:30e9745a0465b004f42517"
};

const SESSION_KEY = 'dsp_session_v1';
const THEME_KEY   = 'moto_theme_v1';
const COLLECTION  = 'vueltas';

let db = null, fbMod = null;
let currentDriver = '';
let homeUnsub   = null;
let cachedList  = [];
let motoFilter  = 'all';
let storageMod  = null;
let storage     = null;
let fotoVueltaId   = null;
let motoUsers      = [];
let motoPinSelected = null;
let motoPinValue    = '';

const $ = id => document.getElementById(id);

function today() { return new Date().toISOString().slice(0, 10); }
function nowTime() {
  return new Date().toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', hour12: false });
}

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */
function getExpiry(loginAt) {
  const d = new Date(loginAt);
  d.setDate(d.getDate() + 1);
  d.setHours(3, 0, 0, 0);
  return d.getTime();
}

async function init() {
  if (localStorage.getItem(THEME_KEY) === 'dark') applyDark(true);

  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  try {
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    [fbMod, storageMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js')
    ]);
    const existing = getApps().find(a => a.name === 'moto-main');
    const app = existing || initializeApp(FIREBASE_CFG, 'moto-main');
    db      = fbMod.getFirestore(app);
    storage = storageMod.getStorage(app);
  } catch(e) {
    console.error('Firebase init error:', e);
  }

  // Verificar sesión
  try {
    const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (session && session.role === 'motorista' && Date.now() < getExpiry(session.loginAt)) {
      currentDriver = session.name;
      goHome();
      return;
    }
  } catch {}

  localStorage.removeItem(SESSION_KEY);
  await loadLoginScreen();
  showScreen('s-login');
}

function showScreen(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0, 0);
}

async function loadLoginScreen() {
  if (!db) return;
  try {
    const snap = await fbMod.getDoc(fbMod.doc(db, 'config', 'team'));
    const members = snap.exists() ? (snap.data().members || []) : [];
    motoUsers = members.filter(m => m.active !== false && m.role === 'motorista');
  } catch { motoUsers = []; }
  renderMotoUsers();
}

function renderMotoUsers() {
  const el = $('moto-user-list');
  if (!motoUsers.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.75rem;padding:1rem">Sin motoristas configurados.</div>';
    return;
  }
  el.innerHTML = motoUsers.map(u =>
    `<button class="moto-user-btn" onclick="mSelectUser('${u.id}','${u.name.replace(/'/g,"\\'")}',this)">🚐 ${esc(u.name)}</button>`
  ).join('');
}

/* ═══════════════════════════════════
   PIN LOGIN
═══════════════════════════════════ */
window.mSelectUser = (id, name, btn) => {
  motoPinSelected = { id, name };
  motoPinValue = '';
  mUpdateDots();
  document.querySelectorAll('.moto-user-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  $('moto-pin-sub').textContent = `Hola, ${name}. Ingresa tu PIN.`;
  $('moto-pin-entry').style.display = 'block';
  $('moto-login-err').style.display = 'none';
};

window.mBackToUsers = () => {
  $('moto-pin-entry').style.display = 'none';
  $('moto-pin-sub').textContent = 'Selecciona tu nombre para continuar.';
  document.querySelectorAll('.moto-user-btn').forEach(b => b.classList.remove('on'));
  motoPinValue = ''; motoPinSelected = null;
};

window.mPinKey = digit => {
  if (motoPinValue.length >= 4) return;
  motoPinValue += digit;
  mUpdateDots();
  if (motoPinValue.length === 4) setTimeout(mDoPinLogin, 120);
};

window.mPinBackspace = () => {
  motoPinValue = motoPinValue.slice(0, -1);
  mUpdateDots();
};

function mUpdateDots() {
  document.querySelectorAll('#moto-pin-dots .pin-dot').forEach((dot, i) => {
    dot.classList.toggle('filled', i < motoPinValue.length);
  });
}

window.mDoPinLogin = async () => {
  if (!motoPinSelected || motoPinValue.length !== 4) return;
  const user = motoUsers.find(u => u.id === motoPinSelected.id);
  if (!user || user.pin !== motoPinValue) {
    $('moto-login-err').textContent = 'PIN incorrecto.';
    $('moto-login-err').style.display = 'block';
    motoPinValue = '';
    mUpdateDots();
    return;
  }
  const session = { userId: user.id, name: user.name, role: user.role, loginAt: Date.now() };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  updateMotoLastAccess(user.id); // fire-and-forget
  currentDriver = user.name;
  $('moto-login-err').style.display = 'none';
  goHome();
};

async function updateMotoLastAccess(userId) {
  if (!db || !fbMod) return;
  try {
    const snap = await fbMod.getDoc(fbMod.doc(db, 'config', 'team'));
    if (!snap.exists()) return;
    const members = snap.data().members || [];
    const idx = members.findIndex(m => m.id === userId);
    if (idx === -1) return;
    members[idx].lastAccess = Date.now();
    await fbMod.setDoc(fbMod.doc(db, 'config', 'team'), { members });
  } catch(e) { console.error(e); }
}

window.doLogout = () => {
  if (homeUnsub) { homeUnsub(); homeUnsub = null; }
  localStorage.removeItem(SESSION_KEY);
  currentDriver = ''; motoPinValue = ''; motoPinSelected = null;
  $('moto-pin-entry').style.display = 'none';
  $('moto-pin-sub').textContent = 'Selecciona tu nombre para continuar.';
  document.querySelectorAll('.moto-user-btn').forEach(b => b.classList.remove('on'));
  renderMotoUsers();
  showScreen('s-login');
};

/* ═══════════════════════════════════
   HOME
═══════════════════════════════════ */
function getGPS() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: Date.now() }),
      ()  => resolve(null),
      { timeout: 8000, maximumAge: 30000 }
    );
  });
}

function goHome() {
  $('m-name-lbl').textContent = `🚐 ${currentDriver}`;
  $('m-date-lbl').textContent = new Date().toLocaleDateString('es-SV', {
    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
  }).toUpperCase();
  showScreen('s-home');
  startListener();
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(() => {}, () => {});
}

function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body });
  }
}

function startListener() {
  if (!db) { renderList([]); return; }
  if (homeUnsub) { homeUnsub(); homeUnsub = null; }

  $('m-list').innerHTML = '<div class="empty-state"><span class="spin"></span></div>';

  const q = fbMod.query(
    fbMod.collection(db, COLLECTION),
    fbMod.where('date', '==', today()),
    fbMod.where('assignedTo', '==', currentDriver),
    fbMod.orderBy('order', 'asc')
  );

  let firstSnap = true;
  let prevEmergencyIds = new Set();

  homeUnsub = fbMod.onSnapshot(q,
    snap => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!firstSnap) {
        list.forEach(v => {
          if (v.emergency && !prevEmergencyIds.has(v.id)) {
            notify('🚨 Emergencia asignada', `Vuelta a ${v.destination} marcada como emergencia`);
          }
        });
      }
      firstSnap = false;
      prevEmergencyIds = new Set(list.filter(v => v.emergency).map(v => v.id));
      renderList(list);
    },
    err  => {
      $('m-list').innerHTML = `<div class="empty-state" style="color:var(--err-tx)">Error al cargar. Verifica tu conexión.</div>`;
      console.error(err);
    }
  );
}

/* ═══════════════════════════════════
   RENDER
═══════════════════════════════════ */
function renderList(list) {
  cachedList = list;

  const total = list.length;
  const done  = list.filter(v => v.status === 'done').length;
  const pct   = total ? Math.round(done / total * 100) : 0;

  $('m-stats').innerHTML = `
    <div class="m-stat">
      <div class="m-stat-num">${total}</div><div class="m-stat-lbl">Total</div>
    </div>
    <div class="m-stat">
      <div class="m-stat-num" style="color:var(--done-tx)">${done}</div><div class="m-stat-lbl">Hechas</div>
    </div>
    <div class="m-stat">
      <div class="m-stat-num" style="color:${pct===100?'var(--done-tx)':'var(--text)'}">${pct}%</div><div class="m-stat-lbl">Completado</div>
    </div>`;

  applyMotoFilter();
}

function applyMotoFilter() {
  const filtered = motoFilter === 'done'
    ? cachedList.filter(v => v.status === 'done')
    : motoFilter === 'pending'
      ? cachedList.filter(v => v.status !== 'done')
      : cachedList;
  renderCards(filtered);
}

window.setMotoFilter = (f, btn) => {
  motoFilter = f;
  document.querySelectorAll('.m-fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  applyMotoFilter();
};

function renderCards(list) {
  const el = $('m-list');
  if (!list.length) {
    const msg = motoFilter === 'done'
      ? 'No hay vueltas completadas.' : motoFilter === 'pending'
      ? 'No hay vueltas pendientes.' : 'No tienes vueltas asignadas para hoy.<br/>Consulta con el supervisor.';
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🚐</div><div class="empty-text">${msg}</div></div>`;
    return;
  }

  const sorted = [...list].sort((a, b) => {
    if (a.emergency && !b.emergency) return -1;
    if (!a.emergency && b.emergency) return 1;
    return (a.order || 0) - (b.order || 0);
  });

  el.innerHTML = sorted.map(v => {
    const isPending = v.status === 'pending';
    const isCamino  = v.status === 'en_camino';
    const isDone    = v.status === 'done';
    const cardCls   = isDone ? 'mc-done' : isCamino ? 'mc-camino' : '';
    const emgCls    = v.emergency ? 'emergency' : '';
    const circleCls = isDone ? 'mc-done' : isCamino ? 'mc-camino' : '';
    const doneTime  = v.completedAt
      ? new Date(v.completedAt).toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', hour12: false })
      : '';

    const photos    = v.photos || [];
    const canPhoto  = (isCamino || isDone) && photos.length < 3;
    const thumbsHtml = photos.length
      ? `<div class="photo-strip">${photos.map(u => `<img class="photo-thumb" src="${esc(u)}" onclick="window.open('${escAttr(u)}','_blank')" alt="foto"/>`).join('')}</div>`
      : '';
    const ordenLink = v.linkedOrderId
      ? `<div style="padding:0 14px 8px"><a href="https://despacho-ordenes.web.app/?orden=${v.linkedOrderId}" target="_blank" rel="noopener" style="display:block;text-align:center;padding:10px 14px;border:1px solid var(--info-bd);border-radius:var(--r);color:var(--info-tx);font-size:.78rem;font-weight:600;text-decoration:none;background:var(--info-bg)">📋 Ver lista de productos →</a></div>`
      : '';

    return `
      <div class="mcard ${cardCls} ${emgCls}" id="mc-${v.id}">
        ${v.emergency ? `<div class="emergency-bar">🚨 ATENCIÓN — VUELTA DE EMERGENCIA</div>` : ''}
        <div class="mcard-top">
          <div class="m-order-circle ${circleCls}">${v.order}</div>
          <div class="mcard-info">
            <div class="mcard-dest">${esc(v.destination || '')}</div>
            ${v.description ? `<div class="mcard-desc">${esc(v.description)}</div>` : ''}
            ${isDone && doneTime ? `
              <div class="mcard-done-time">✓ Completada a las ${doneTime}</div>
              <button class="btn-undo" onclick="revertirVuelta('${v.id}')">↩ Deshacer</button>` : ''}
          </div>
        </div>
        ${isCamino ? `<div class="mcard-yendo">🚐 Yendo a ${esc(v.destination || '')}…</div>` : ''}
        ${ordenLink}
        ${!isDone ? `
        <div class="mcard-actions">
          ${isPending ? `
            <button class="btn btn-warn" onclick="irEnCamino('${v.id}','${escAttr(v.destination||'')}')">
              🚐 En camino
            </button>` : ''}
          ${isCamino ? `
            <button class="btn btn-done-action" onclick="completarVuelta('${v.id}')">
              ✓ ACABÉ
            </button>` : ''}
        </div>` : ''}
        ${thumbsHtml}
        ${(isCamino || isDone) ? `<button class="btn-foto" onclick="tomarFoto('${v.id}')" ${canPhoto ? '' : 'disabled'}>
          ${canPhoto ? '📷 Foto' : '📷 3/3 — máximo alcanzado'}
        </button>` : ''}
      </div>`;
  }).join('');
}

/* ═══════════════════════════════════
   DARK MODE
═══════════════════════════════════ */
function applyDark(on) {
  document.body.classList.toggle('dark', on);
  const btn = $('theme-btn');
  if (btn) btn.textContent = on ? '☀️' : '🌙';
}

window.toggleDark = () => {
  const isDark = document.body.classList.contains('dark');
  applyDark(!isDark);
  localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark');
};

/* ═══════════════════════════════════
   ACCIONES
═══════════════════════════════════ */
window.irEnCamino = async (id, dest) => {
  const gps = await getGPS();
  const update = {
    status:   'en_camino',
    paradero: `En camino a ${dest} — ${nowTime()}`
  };
  if (gps) update.location_start = gps;
  try {
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), update);
  } catch(e) { console.error(e); }
};

window.completarVuelta = async id => {
  const gps = await getGPS();
  const update = {
    status:      'done',
    completedAt: Date.now(),
    paradero:    '',
    emergency:   false
  };
  if (gps) update.location_end = gps;
  try {
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), update);
  } catch(e) { console.error(e); }
};

window.tomarFoto = id => {
  fotoVueltaId = id;
  const inp = $('foto-input');
  inp.value = '';
  inp.click();
};

window.uploadFoto = async input => {
  const file = input.files[0];
  if (!file || !fotoVueltaId) return;
  const id  = fotoVueltaId;
  const btn = document.querySelector(`#mc-${id} .btn-foto`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Subiendo…'; }
  try {
    const path    = `vueltas/${id}/${Date.now()}_${currentDriver}.jpg`;
    const storRef = storageMod.ref(storage, path);
    await storageMod.uploadBytes(storRef, file);
    const url = await storageMod.getDownloadURL(storRef);
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), {
      photos: fbMod.arrayUnion(url)
    });
  } catch(e) {
    console.error(e);
    alert('Error al subir la foto. Intenta de nuevo.');
    if (btn) { btn.disabled = false; btn.textContent = '📷 Foto'; }
  }
};

window.revertirVuelta = async id => {
  try {
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), {
      status:      'en_camino',
      completedAt: null
    });
  } catch(e) { console.error(e); }
};

/* ═══════════════════════════════════
   UTILS
═══════════════════════════════════ */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return String(s).replace(/'/g,"\\'"); }

/* ═══════════════════════════════════
   START
═══════════════════════════════════ */
document.addEventListener('DOMContentLoaded', init);
</script>
<input type="file" id="foto-input" accept="image/*" capture="environment" style="display:none" onchange="uploadFoto(this)"/>
</body>
</html>
