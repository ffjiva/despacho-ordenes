<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Portal Motorista</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root {
  --bg: #161410;
  --surface: #1f1c18;
  --surface2: #272320;
  --border: #2e2a24;
  --border2: #26231f;
  --text: #e8e2d8;
  --text2: #a09890;
  --muted: #7a7266;
  --accent: #1f1c18;
  --accent2: #4caf7d;
  --brand: #c8922a;
  --done-bg: #0f2a1a;
  --done-bd: #1e5c38;
  --done-tx: #4caf7d;
  --warn-bg: #2e2210;
  --warn-bd: #5c400e;
  --warn-tx: #c8922a;
  --err-bg: #2a0f0c;
  --err-bd: #8a2a22;
  --err-tx: #f5a0a0;
  --info-bg: #0c1a2a;
  --info-bd: #1a4a8a;
  --info-tx: #7ab0f0;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
  --r: 6px;
  --r2: 10px;
}
body.dark {
  --bg: #161410;
  --surface: #1f1c18;
  --surface2: #272320;
  --border: #2e2a24;
  --border2: #26231f;
  --text: #e8e2d8;
  --text2: #a09890;
  --muted: #7a7266;
  --accent: #1f1c18;
  --accent2: #4caf7d;
  --brand: #c8922a;
  --done-bg: #0f2a1a;
  --done-bd: #1e5c38;
  --done-tx: #4caf7d;
  --warn-bg: #2e2210;
  --warn-bd: #5c400e;
  --warn-tx: #c8922a;
  --err-bg: #2a0f0c;
  --err-bd: #8a2a22;
  --err-tx: #f5a0a0;
  --info-bg: #0c1a2a;
  --info-bd: #1a4a8a;
  --info-tx: #7ab0f0;
}
body.dark .fld select { background: var(--surface); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

.scr { display: none; min-height: 100vh; }
.scr.on { display: block; }

/* ── LOGIN ── */
.login-wrap {
  max-width: 400px; margin: 0 auto;
  padding: 3rem 1.25rem 3rem;
  display: flex; flex-direction: column; align-items: center;
}
.login-logo {
  width: 64px; height: 64px; background: var(--accent); color: #fff;
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; margin-bottom: 1.25rem;
}
.login-h   { font-size: 1.1rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: .3rem; text-align: center; }
.login-sub { font-size: .75rem; color: var(--text2); text-align: center; margin-bottom: 1.75rem; line-height: 1.7; }
.login-form { width: 100%; }

/* ── FORM ── */
.fld { margin-bottom: .9rem; }
.fld label { display: block; font-size: .6rem; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.fld input, .fld select {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: var(--r);
  font-family: var(--mono); font-size: .82rem;
  background: var(--surface); color: var(--text);
  outline: none; transition: border-color .15s;
}
.fld input:focus, .fld select:focus { border-color: var(--accent2); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 14px 18px; border-radius: var(--r);
  font-family: var(--mono); font-size: .78rem; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
  cursor: pointer; border: none; transition: all .15s;
  white-space: nowrap; min-height: 48px;
}
.btn:active { transform: scale(.97); }
.btn-dark    { background: var(--accent); color: #fff; width: 100%; }
.btn-dark:hover { background: var(--surface2); }
.btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-warn    { background: var(--warn-bg); color: var(--warn-tx); border: 1px solid var(--warn-bd); width: 100%; font-size: .85rem; }
.btn-done-action { background: var(--done-bg); color: var(--done-tx); border: 1px solid var(--done-bd); width: 100%; font-size: .85rem; }

/* ── NOTICE BOXES ── */
.box-err { background: var(--err-bg); border: 1px solid var(--err-bd); color: var(--err-tx); padding: 10px 12px; border-radius: var(--r); font-size: .72rem; }

/* ── SPINNER ── */
.spin {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(0,0,0,.1); border-top-color: currentColor;
  border-radius: 50%; animation: rot .65s linear infinite; vertical-align: middle; margin-right: 6px;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* ── HEADER ── */
.m-header {
  background: var(--accent); color: #fff;
  padding: 1rem 1rem .9rem;
  position: sticky; top: 0; z-index: 100;
}
.m-header-top { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
.m-name { font-size: .9rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.m-date { font-size: .6rem; opacity: .6; letter-spacing: .05em; text-transform: uppercase; margin-top: 3px; }
.m-logout {
  background: transparent; border: 1px solid rgba(255,255,255,.3);
  color: rgba(255,255,255,.85); font-family: var(--mono); font-size: .6rem;
  font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 7px 12px; border-radius: var(--r); cursor: pointer; flex-shrink: 0;
  min-height: 36px;
}

/* ── STATS BAR ── */
.m-stats {
  display: flex; background: var(--surface);
  border-bottom: 1px solid var(--border2);
}
.m-stat {
  flex: 1; padding: .7rem .5rem; text-align: center;
  border-right: 1px solid var(--border2);
}
.m-stat:last-child { border-right: none; }
.m-stat-num { font-size: 1.3rem; font-weight: 700; }
.m-stat-lbl { font-size: .52rem; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }

/* ── VUELTA CARDS ── */
.m-list { padding: .75rem .875rem 4rem; max-width: 600px; margin: 0 auto; }
.mcard {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); margin-bottom: 10px; overflow: hidden;
}
.mcard.mc-camino { border-color: var(--warn-bd); border-left: 4px solid var(--warn-tx); }
.mcard.mc-done   { background: var(--done-bg); border-color: var(--done-bd); }
@keyframes pulse-border {
  0%, 100% { border-top-color: #ff3b30; }
  50%       { border-top-color: rgba(255,59,48,.3); }
}
.mcard.emergency {
  background: var(--err-bg);
  border-top: 3px solid #ff3b30;
  animation: pulse-border .8s ease-in-out infinite;
}
.emergency-bar {
  background: #ff3b30; color: #fff;
  font-size: .7rem; font-weight: 700; text-align: center;
  padding: 8px; letter-spacing: .05em;
}

.mcard-top { display: flex; align-items: flex-start; gap: 12px; padding: 14px 14px 10px; }
.m-order-circle {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 700;
  background: var(--border2); color: var(--muted);
}
.m-order-circle.mc-camino { background: var(--warn-tx); color: #fff; }
.m-order-circle.mc-done   { background: var(--done-tx); color: #fff; }

.mcard-info { flex: 1; min-width: 0; }
.mcard-dest {
  font-size: 1rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .03em; color: var(--text); line-height: 1.3;
}
.mcard.mc-done .mcard-dest { color: var(--done-tx); }
.mcard-desc { font-size: .75rem; color: var(--text2); margin-top: 4px; line-height: 1.45; }
.mcard-done-time { font-size: .68rem; color: var(--done-tx); margin-top: 6px; }
.btn-undo {
  font-family: var(--mono); font-size: .62rem; color: var(--muted);
  background: transparent; border: 1px solid var(--border2);
  border-radius: var(--r); padding: 5px 10px; cursor: pointer;
  margin-top: 6px; display: inline-block;
}
/* ── FILTER BAR ── */
.m-filter-bar {
  display: flex; gap: 6px; padding: .6rem .875rem;
  background: var(--surface); border-bottom: 1px solid var(--border2);
  overflow-x: auto;
}
.m-filter-bar::-webkit-scrollbar { display: none; }
.m-fbtn {
  padding: 4px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  font-family: var(--mono); font-size: .65rem;
  cursor: pointer; white-space: nowrap; color: var(--muted);
  letter-spacing: .04em; transition: all .15s;
}
.m-fbtn.on { background: var(--brand); color: #1a1000; border-color: var(--brand); }
.mcard-yendo {
  font-size: .75rem; color: var(--warn-tx); font-weight: 600;
  padding: 0 14px 6px 62px;
}

.mcard-actions { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.photo-strip { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 6px; }
.photo-thumb { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); }
.btn-foto {
  font-family: var(--mono); font-size: .72rem; font-weight: 600;
  background: var(--info-bg); color: var(--info-tx); border: 1px solid var(--info-bd);
  border-radius: var(--r); padding: 8px 14px; cursor: pointer;
  margin: 0 12px 10px; display: block; width: calc(100% - 24px);
  min-height: 40px;
}
.btn-foto:disabled { opacity: .45; cursor: not-allowed; }

.empty-state { text-align: center; padding: 3rem 1rem 2rem; color: var(--muted); }
.empty-icon  { font-size: 2.5rem; opacity: .3; margin-bottom: .75rem; }
.empty-text  { font-size: .8rem; line-height: 1.7; }

/* ── DOMICILIO BADGES ── */
.dmbadge { font-size:.58rem; font-weight:700; padding:2px 7px; border-radius:20px; border:1px solid; display:inline-block; white-space:nowrap; }
.dmbadge-pendiente    { background:var(--warn-bg); color:var(--warn-tx); border-color:var(--warn-bd); }
.dmbadge-en_camino    { background:var(--info-bg); color:var(--info-tx); border-color:var(--info-bd); }
.dmbadge-entregado    { background:var(--done-bg); color:var(--done-tx); border-color:var(--done-bd); }
.dmbadge-no_entregado { background:var(--err-bg);  color:var(--err-tx);  border-color:var(--err-bd); }
.mcard.mc-noent       { background:var(--err-bg);  border-color:var(--err-bd); }
.mcard.mc-noent .mcard-dest { color:var(--err-tx); }

/* ── NO ENTREGA MODAL ── */
@keyframes slideUp { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.ne-opt {
  display:block; width:100%; padding:13px 14px; margin-bottom:8px;
  border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); font-family:var(--mono); font-size:.8rem;
  color:var(--text); cursor:pointer; text-align:left; transition:all .15s; min-height:48px;
}
.ne-opt:active, .ne-opt.ne-sel { background:var(--accent); color:#fff; border-color:var(--accent); }

/* ── DATE / TIME INPUT DARK FIX ── */
input[type="date"],
input[type="time"] {
  color-scheme: dark;
}
body:not(.dark) input[type="date"],
body:not(.dark) input[type="time"] {
  color-scheme: light;
}
.dir-line { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dir-exp  { cursor: pointer; }
.dir-exp::after { content: ' ▾'; font-size: .58rem; color: var(--info-tx); }
.dir-exp.open { white-space: normal; overflow: visible; text-overflow: unset; }
.dir-exp.open::after { content: ' ▴'; }
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="s-login" class="scr on">
  <div class="login-wrap">
    <div class="login-logo">🚐</div>
    <div class="login-h">Portal Motorista</div>
    <div class="login-sub">Ingresa con tu cuenta para continuar.</div>
    <div class="login-form">
      <div class="fld"><label>Email</label><input id="moto-email" type="email" placeholder="tu@email.com" autocomplete="email" onkeydown="if(event.key==='Enter')doMotoLogin()"/></div>
      <div class="fld"><label>Contraseña</label><input id="moto-pw" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doMotoLogin()"/></div>
      <div id="moto-login-err" class="box box-err" style="display:none;margin-bottom:.75rem"></div>
      <button class="btn btn-dark btn-full" id="btn-moto-login" onclick="doMotoLogin()">Ingresar →</button>
    </div>
  </div>
</div>

<!-- ══════════════ HOME ══════════════ -->
<div id="s-home" class="scr">
  <div class="m-header">
    <div class="m-header-top">
      <div>
        <div class="m-name" id="m-name-lbl">—</div>
        <div class="m-date" id="m-date-lbl"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="m-logout" id="theme-btn" onclick="toggleDark()" title="Modo oscuro">🌙</button>
        <button class="m-logout" onclick="doLogout()">Salir</button>
      </div>
    </div>
  </div>

  <div class="m-stats" id="m-stats">
    <div class="m-stat"><div class="m-stat-num">—</div><div class="m-stat-lbl">Total</div></div>
    <div class="m-stat"><div class="m-stat-num">—</div><div class="m-stat-lbl">Hechas</div></div>
    <div class="m-stat"><div class="m-stat-num">—%</div><div class="m-stat-lbl">Completado</div></div>
  </div>

  <div class="m-filter-bar">
    <button class="m-fbtn on" onclick="setMotoFilter('all',this)">Todas</button>
    <button class="m-fbtn"    onclick="setMotoFilter('vueltas',this)">Vueltas</button>
    <button class="m-fbtn"    onclick="setMotoFilter('entregas',this)">Entregas</button>
    <button class="m-fbtn"    onclick="setMotoFilter('terminadas',this)">Terminadas</button>
    <button class="m-fbtn"    onclick="setMotoFilter('encola',this)">En cola</button>
  </div>

  <div class="m-list" id="m-list">
    <div class="empty-state"><span class="spin"></span></div>
  </div>

  <!-- Barra fija de salida -->
  <div style="position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--surface);border-top:1px solid var(--border);padding:.55rem 1rem;display:flex;align-items:center">
    <button onclick="doLogout()" style="min-height:44px;padding:8px 22px;border:2px solid var(--accent);border-radius:6px;background:transparent;color:var(--accent);font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.07em;cursor:pointer">← Salir</button>
  </div>
</div>

<script type="module">
/* ═══════════════════════════════════
   CONFIG & STATE
═══════════════════════════════════ */
const FIREBASE_CFG = {
  apiKey: "AIzaSyAb_0e8Hh_UfzN54S3VZGQXqUD3t53bWrQ",
  authDomain: "despacho-ordenes.firebaseapp.com",
  projectId: "despacho-ordenes",
  storageBucket: "despacho-ordenes.firebasestorage.app",
  messagingSenderId: "694628838648",
  appId: "1:694628838838:web:30e9745a0465b004f42517"
};

const THEME_KEY       = 'moto_theme_v1';
const COLLECTION      = 'vueltas';
const WHATSAPP_GROUP  = '50377081881';

let db = null, fbMod = null, authMod = null, auth = null;
let currentDriver = '';
let currentDriverUid = '';
let homeUnsub       = null;
let domUnsub        = null;
let cachedList      = [];
let cachedArrastre  = [];
let cachedDomicilios = [];
let motoFilter      = 'all';
let storageMod      = null;
let storage         = null;
let messagingMod    = null;
let fotoVueltaId    = null;
let fotoDomId       = null;
let noEntregaId     = null;
let noEntregaMotivo = '';
const MOTIVOS_NE = ['Cliente no contesta', 'Dirección incorrecta', 'Cliente reagendó', 'Devolver a bodega'];

const $ = id => document.getElementById(id);

function today() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/El_Salvador' });
}
function nowTime() {
  return new Date().toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', hour12: false });
}

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */
async function init() {
  if (localStorage.getItem(THEME_KEY) === 'dark') applyDark(true);

  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  try {
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    [fbMod, authMod, storageMod, messagingMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js')
    ]);
    const existing = getApps().find(a => a.name === 'moto-main');
    const app = existing || initializeApp(FIREBASE_CFG, 'moto-main');
    db      = fbMod.getFirestore(app);
    auth    = authMod.getAuth(app);
    storage = storageMod.getStorage(app);
  } catch(e) {
    console.error('Firebase init error:', e);
  }

  if (!authMod || !auth) {
    showScreen('s-login');
    $('moto-login-err').textContent = 'Error al conectar con el servidor. Recarga la página.';
    $('moto-login-err').style.display = 'block';
    return;
  }

  // Firebase Auth maneja la persistencia de sesión automáticamente
  authMod.onAuthStateChanged(auth, async (firebaseUser) => {
    if (firebaseUser) {
      try {
        const snap = await fbMod.getDoc(fbMod.doc(db, 'users', firebaseUser.uid));
        if (!snap.exists() || snap.data().active !== true) {
          await authMod.signOut(auth);
          showScreen('s-login');
          return;
        }
        const profile = snap.data();
        if (profile.role !== 'motorista' && profile.role !== 'super') {
          await authMod.signOut(auth);
          showScreen('s-login');
          $('moto-login-err').textContent = 'No tienes acceso a esta sección.';
          $('moto-login-err').style.display = 'block';
          return;
        }
        currentDriver    = profile.name;
        currentDriverUid = firebaseUser.uid;
        goHome();
      } catch(e) {
        console.error('Auth check error:', e);
        showScreen('s-login');
      }
    } else {
      showScreen('s-login');
    }
  });
}

function showScreen(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0, 0);
}

window.doMotoLogin = async () => {
  const email = $('moto-email').value.trim();
  const pw    = $('moto-pw').value;
  const errEl = $('moto-login-err');
  const btn   = $('btn-moto-login');
  if (!email || !pw) {
    errEl.textContent = 'Completa todos los campos.';
    errEl.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Ingresando...';
  errEl.style.display = 'none';
  const AUTH_ERRORS = {
    'auth/user-not-found':     'Correo no registrado',
    'auth/wrong-password':     'Contraseña incorrecta',
    'auth/invalid-credential': 'Correo o contraseña incorrectos',
    'auth/invalid-email':      'Correo no válido',
    'auth/too-many-requests':  'Demasiados intentos. Espera unos minutos',
  };
  try {
    await authMod.signInWithEmailAndPassword(auth, email, pw);
    // onAuthStateChanged maneja la navegación
  } catch(e) {
    errEl.textContent = AUTH_ERRORS[e.code] || 'Error al ingresar.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Ingresar →';
  }
};

window.addEventListener('beforeunload', e => {
  const hayVueltaEnCurso = cachedList.some(v => v.status === 'en_camino' || v.status === 'en_curso')
    || cachedDomicilios.some(d => d.status === 'en_camino');
  if (hayVueltaEnCurso) { e.preventDefault(); e.returnValue = ''; }
});

window.doLogout = async () => {
  if (homeUnsub) { homeUnsub(); homeUnsub = null; }
  if (domUnsub)  { domUnsub();  domUnsub  = null; }
  currentDriver    = '';
  currentDriverUid = '';
  if (authMod && auth) await authMod.signOut(auth);
  // onAuthStateChanged mostrará s-login automáticamente
};

/* ═══════════════════════════════════
   HOME
═══════════════════════════════════ */
function getGPS() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: Date.now() }),
      ()  => resolve(null),
      { timeout: 8000, maximumAge: 30000 }
    );
  });
}

async function registerFCMToken(userName) {
  if (!messagingMod || !db) return;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const existing = getApps().find(a => a.name === 'moto-main');
    if (!existing) return;

    const messaging = messagingMod.getMessaging(existing);
    const token = await messagingMod.getToken(messaging, {
      vapidKey: 'BAd50NP_cteokVTzaDCzDQeaqaZLRAgpbc2VcRveRsFBLHgl2VhBGlvQA47lJ095umC3c08luqVeFG4WPDSXuzg',
      serviceWorkerRegistration: await navigator.serviceWorker.register('/firebase-messaging-sw.js')
    });
    if (!token) return;

    if (!auth?.currentUser?.uid) return;
    const userRef = fbMod.doc(db, 'users', auth.currentUser.uid);
    const userSnap = await fbMod.getDoc(userRef);
    if (!userSnap.exists()) return;
    const tokens = userSnap.data().fcmTokens || [];

    }
    console.log('FCM token registrado para', userName);

async function fetchArrastre() {
  if (!db) return;
  const todaySV = today();
  const from = new Date();
  from.setDate(from.getDate() - 14);
  const fromDate = from.toLocaleDateString('en-CA', { timeZone: 'America/El_Salvador' });
  try {
    const vSnap = await fbMod.getDocs(fbMod.query(
      fbMod.collection(db, COLLECTION),
      fbMod.where('date', '>=', fromDate),
      fbMod.where('date', '<', todaySV)
    ));
    const vPrev = vSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(v => v.assignedTo === currentDriverUid && ['pending','en_camino'].includes(v.status))
      .map(v => ({ ...v, _arrastre: true }));
    cachedArrastre = vPrev;
    if (vPrev.length) renderCombined();
  } catch(e) { console.warn('fetchArrastre:', e.message); }
}

let cachedEnCola = [];

async function fetchEnCola() {
  if (!db) return;
  const from = new Date();
  from.setDate(from.getDate() - 30);
  const fromDate = from.toLocaleDateString('en-CA', { timeZone: 'America/El_Salvador' });
  try {
    // Query por rango de fecha — filtrar assignedTo y status en cliente
    const todaySV = today();
    const vSnap = await fbMod.getDocs(fbMod.query(
      fbMod.collection(db, COLLECTION),
      fbMod.where('date', '>=', fromDate),
      fbMod.where('date', '<=', todaySV)
    ));
    const vueltas = vSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(v => v.assignedTo === currentDriverUid && ['pending','en_camino'].includes(v.status));

    const dSnap = await fbMod.getDocs(fbMod.query(
      fbMod.collection(db, 'domicilios'),
      fbMod.where('date', '>=', fromDate),
      fbMod.where('date', '<=', todaySV)
    ));
    const domicilios = dSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(d => d.assignedTo === currentDriverUid && ['pendiente','en_camino'].includes(d.status));

    cachedEnCola = [...vueltas, ...domicilios].sort((a, b) =>
      (a.date || '').localeCompare(b.date || '') || (a.order || 0) - (b.order || 0)
    );
    applyMotoFilter();
  } catch(e) {
    console.warn('fetchEnCola:', e.message);
    if (motoFilter === 'encola') $('m-list').innerHTML = `<div class="empty-state" style="color:var(--err-tx)">Error al cargar: ${esc(e.message)}</div>`;
  }
}

function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body });
  }
}

function startListener() {
  if (!db) { renderList([]); return; }
  if (homeUnsub) { homeUnsub(); homeUnsub = null; }

  $('m-list').innerHTML = '<div class="empty-state"><span class="spin"></span></div>';

  const q = fbMod.query(
    fbMod.collection(db, COLLECTION),
    fbMod.where('date', '==', today()),
    fbMod.where('assignedTo', '==', currentDriverUid),
    fbMod.orderBy('order', 'asc')
  );

  let firstSnap = true;
  let prevEmergencyIds = new Set();
  let prevVueltaIds = new Set();

  homeUnsub = fbMod.onSnapshot(q,
    snap => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!firstSnap) {
        list.forEach(v => {
          if (v.emergency && !prevEmergencyIds.has(v.id)) {
            notify('🚨 Emergencia asignada', `Vuelta a ${v.destination} marcada como emergencia`);
          }
          if (!prevVueltaIds.has(v.id)) {
            notify('🚐 Nueva vuelta asignada', `${v.destination || 'Revisa tus vueltas'}`);
          }
        });
      }
      firstSnap = false;
      prevEmergencyIds = new Set(list.filter(v => v.emergency).map(v => v.id));
      prevVueltaIds = new Set(list.map(v => v.id));
      renderList(list);
    },
    err  => {
      $('m-list').innerHTML = `<div class="empty-state" style="color:var(--err-tx)">Error al cargar. Verifica tu conexión.</div>`;
      console.error(err);
    }
  );
}

/* ═══════════════════════════════════
   DOMICILIOS LISTENER
═══════════════════════════════════ */
function startDomiciliosListener() {
  if (!db) { cachedDomicilios = []; renderCombined(); return; }
  if (domUnsub) { domUnsub(); domUnsub = null; }

  let todayItems    = [];
  let carryoverItems = [];

  const merge = () => {
    const seen = new Set();
    // todayItems primero: si un doc existe en ambos, gana la versión de hoy
    cachedDomicilios = [...todayItems, ...carryoverItems].filter(d => {
      if (seen.has(d.id)) return false;
      seen.add(d.id);
      return true;
    }).filter(d => {
      // Si viene del carryover pero ya fue resuelto hoy, ocultarlo
      if (d._carryover && (d.status === 'entregado' || d.status === 'done')) return false;
      return true;
    });
    renderCombined();
  };

  // Query en tiempo real — hoy
  const qToday = fbMod.query(
    fbMod.collection(db, 'domicilios'),
    fbMod.where('date', '==', today()),
    fbMod.where('assignedTo', '==', currentDriverUid),
    fbMod.orderBy('createdAt', 'asc')
  );
  domUnsub = fbMod.onSnapshot(qToday,
    snap => { todayItems = snap.docs.map(d => ({ id: d.id, type: 'domicilio', ...d.data() })); merge(); },
    err => console.warn('domicilios listener:', err.code)
  );

  // One-shot — días anteriores pendientes
  fbMod.getDocs(
    fbMod.query(
      fbMod.collection(db, 'domicilios'),
      fbMod.where('assignedTo', '==', currentDriverUid)
    )
  ).then(snap => {
    const todayStr = today();
    carryoverItems = snap.docs
      .map(d => ({ id: d.id, type: 'domicilio', ...d.data(), _carryover: true }))
      .filter(d =>
        d.date < todayStr &&
        ['pendiente', 'en_camino', 'no_entregado'].includes(d.status)
      );
    merge();
  }).catch(e => console.warn('domicilios carryover:', e.message));
}

/* ═══════════════════════════════════
   RENDER
═══════════════════════════════════ */
const despachoPhotosCache = new Map();

async function prefetchDespachoPhotos(list) {
  // Recolectar todos los linkedOrderIds únicos de la lista
  const ids = new Set();
  list.forEach(v => {
    const linked = v.linkedOrderIds || (v.linkedOrderId ? [v.linkedOrderId] : []);
    linked.forEach(oid => { if (!despachoPhotosCache.has(oid)) ids.add(oid); });
  });
  if (!ids.size) return;
  // Fetch en paralelo, silencioso
  await Promise.all([...ids].map(async oid => {
    try {
      const snap = await fbMod.getDoc(fbMod.doc(db, 'despachos', oid));
      despachoPhotosCache.set(oid, snap.exists() ? (snap.data().photos || []) : []);
    } catch { despachoPhotosCache.set(oid, []); }
  }));
  // Solo re-renderizar si alguna foto nueva fue encontrada
  const hasPhotos = [...ids].some(oid => (despachoPhotosCache.get(oid) || []).length > 0);
  if (hasPhotos) renderCombined();
}

function renderList(list) {
  cachedList = list;
  prefetchDespachoPhotos(list); // fire-and-forget, re-renders cuando termina
  renderCombined();
}

function renderCombined() {
  const arrIds     = new Set(cachedList.map(v => v.id));
  const arrExtras  = cachedArrastre.filter(v => !arrIds.has(v.id));
  const allVueltas = [...arrExtras, ...cachedList];
  const all = [...allVueltas, ...cachedDomicilios];
  const src = motoFilter === 'vueltas'     ? allVueltas
            : motoFilter === 'entregas'    ? cachedDomicilios
            : motoFilter === 'terminadas'  ? all.filter(v => v.status === 'done' || v.status === 'entregado')
            : motoFilter === 'encola'      ? (cachedEnCola || [])
            : all;

  const total = src.length;
  const done  = src.filter(v => v.status === 'done' || v.status === 'entregado').length;
  const pct   = total ? Math.round(done / total * 100) : 0;

  $('m-stats').innerHTML = `
    <div class="m-stat">
      <div class="m-stat-num">${total}</div><div class="m-stat-lbl">Total</div>
    </div>
    <div class="m-stat">
      <div class="m-stat-num" style="color:var(--done-tx)">${done}</div><div class="m-stat-lbl">Hechas</div>
    </div>
    <div class="m-stat">
      <div class="m-stat-num" style="color:${pct===100?'var(--done-tx)':'var(--text)'}">${pct}%</div><div class="m-stat-lbl">Completado</div>
    </div>`;

  applyMotoFilter();
}

function applyMotoFilter() {
  let items;
  const arrIds     = new Set(cachedList.map(v => v.id));
  const arrExtras  = cachedArrastre.filter(v => !arrIds.has(v.id));
  const allVueltas = [...arrExtras, ...cachedList];
  const all = [...allVueltas, ...cachedDomicilios];
  if (motoFilter === 'vueltas') {
    items = allVueltas;
  } else if (motoFilter === 'entregas') {
    items = cachedDomicilios;
  } else if (motoFilter === 'terminadas') {
    items = all.filter(v => v.status === 'done' || v.status === 'entregado');
  } else if (motoFilter === 'encola') {
    items = cachedEnCola || [];
  } else {
    items = all.sort((a, b) => {
      if (a.emergency && !b.emergency) return -1;
      if (!a.emergency && b.emergency) return 1;
      return (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0);
    });
  }
  renderCards(items);
}

window.setMotoFilter = (f, btn) => {
  motoFilter = f;
  document.querySelectorAll('.m-fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if (f === 'encola') {
    fetchEnCola();
  } else {
    renderCombined();
  }
};

function renderCards(list) {
  const el = $('m-list');
  if (!list.length) {
    const icon = motoFilter === 'entregas' ? '📦' : '🚐';
    const msg  = motoFilter === 'entregas'
      ? 'No tienes entregas asignadas para hoy.'
      : motoFilter === 'vueltas'
      ? 'No tienes vueltas asignadas para hoy.<br/>Consulta con el supervisor.'
      : 'No tienes vueltas ni entregas para hoy.<br/>Consulta con el supervisor.';
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">${icon}</div><div class="empty-text">${msg}</div></div>`;
    return;
  }

  const sorted = [...list].sort((a, b) => {
    if (a.emergency && !b.emergency) return -1;
    if (!a.emergency && b.emergency) return 1;
    return (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0);
  });

  el.innerHTML = sorted.map(item =>
    item.type === 'domicilio' ? buildDomCard(item) : buildVueltaCard(item)
  ).join('');
}

  box.style.display = open ? '' : 'none';

            <div style="font-size:.52rem;font-weight:700;letter-spacing:.1em;
                        color:var(--muted);text-transform:uppercase;margin-bottom:2px">
              Entrega
            </div>
            <div class="mcard-dest">${esc((d.cliente || '').toUpperCase())}</div>
            <div style="margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="dmbadge dmbadge-${st}">${STATUS_LBL[st] || st}</span>
              ${d.assignedTo
                ? `<span style="font-size:.58rem;color:var(--muted)">
                     👤 ${esc(d.assignedToName || d.assignedTo)}</span>`
                : ''}
            </div>
          </div>
          <div class="vcard-chevron" id="ch-${cid}"
               style="align-self:flex-start;margin-top:6px">▾</div>
        </div>

        <!-- Info resumida siempre visible -->
        <div style="padding:0 14px 10px 62px">
          ${dirCorta
            ? `<div style="font-size:.67rem;color:var(--text2)">
                 📍 ${esc(dirCorta)}</div>`
            : ''}
          <div style="display:flex;gap:8px;flex-wrap:wrap;
                      margin-top:4px;align-items:center">
            ${d.total
              ? `<span style="font-size:.68rem;font-weight:700">
                   $${Number(d.total).toFixed(2)}</span>`
              : ''}
            ${d.formaPago
              ? `<span class="dstat-chip"
                       style="padding:2px 7px;font-size:.58rem">
                   💳 ${esc(d.formaPago)}</span>`
              : ''}
          </div>
          ${isEnt && doneTime
            ? `<div style="font-size:.65rem;color:var(--done-tx);margin-top:4px">
                 ✓ Entregado a las ${doneTime} — solo lectura</div>`
            : ''}
          ${isNoEnt && d.motivoNoEntrega
            ? `<div style="font-size:.62rem;color:var(--err-tx);margin-top:2px">
                 ✕ ${esc(d.motivoNoEntrega)}</div>`
            : ''}
        </div>
      </div>

      <!-- DETALLE EXPANDIBLE: oculto por defecto -->
      <div id="cd-${cid}" style="display:none;border-top:1px solid var(--border2)">
        <div style="padding:10px 14px 6px">
          ${d.direccion
            ? `<div style="font-size:.67rem;color:var(--text2);margin-bottom:4px">
                 📍 ${esc(d.direccion)}</div>`
            : ''}
          ${d.puntoReferencia
            ? `<div style="font-size:.62rem;color:var(--muted);margin-bottom:4px">
                 🔖 ${esc(d.puntoReferencia)}</div>`
            : ''}
          ${d.telefono
            ? `<div style="font-size:.63rem;color:var(--muted);margin-bottom:4px">
                 📞 ${esc(d.telefono)}</div>`
            : ''}
          ${d.gpsFin
            ? `<div style="margin-bottom:6px">
                 <a class="vloc-link"
                    href="https://maps.google.com/?q=${d.gpsFin.lat},${d.gpsFin.lng}"
                    target="_blank" rel="noopener">📍 Ver ubicación de entrega</a>
               </div>`
            : ''}
          ${comentario
            ? `<div style="font-size:.67rem;color:var(--text2);font-style:italic;
                           background:var(--surface2);padding:6px 10px;
                           border-radius:var(--r);margin-bottom:6px">
                 💬 ${esc(comentario)}</div>`
            : ''}
        </div>

        ${thumbs}

        ${(isCam || isEnt) ? `
        <div style="display:flex;flex-direction:column;gap:6px;padding:0 12px 8px">
          <button class="btn-foto"
            onclick="event.stopPropagation();iniciarCamaraMovil('${d.id}')"
            ${canPhoto ? '' : 'disabled'}>
            📷 Cámara
          </button>
          <button class="btn-foto"
            onclick="event.stopPropagation();elegirDeGaleria('${d.id}')"
            ${canPhoto ? '' : 'disabled'}>
            🖼 Galería
          </button>
        </div>` : ''}

        <div style="padding:0 14px 10px">
          <button
            id="btn-dcm-${d.id}"
            style="background:none;border:none;font-family:'IBM Plex Mono',monospace;
                   font-size:.65rem;color:var(--muted);cursor:pointer;
                   padding:4px 0;text-align:left;display:block;
                   letter-spacing:.03em;text-transform:none"
            onclick="event.stopPropagation();toggleDomComentario('${d.id}')">
            ${comentario
              ? '💬 Comentario <span style="color:var(--warn-tx)">●</span> ▾'
              : '💬 Agregar comentario ▾'}
          </button>
          <div id="dom-cm-${d.id}" style="display:none;margin-top:6px">
            <textarea
              id="dom-txt-${d.id}"
              rows="2"
              placeholder="Agregar nota…"
              style="width:100%;padding:8px 10px;border:1px solid var(--border);
                     border-radius:var(--r);font-family:'IBM Plex Mono',monospace;
                     font-size:.68rem;background:var(--surface2);color:var(--text);
                     resize:none;outline:none;line-height:1.5"
              onclick="event.stopPropagation()">${esc(comentario)}</textarea>
            <button
              onclick="event.stopPropagation();guardarDomComentario('${d.id}')"
              style="margin-top:6px;width:100%;padding:8px;border:none;
                     border-radius:var(--r);background:var(--accent);color:#fff;
                     font-family:'IBM Plex Mono',monospace;font-size:.65rem;
                     font-weight:700;letter-spacing:.06em;cursor:pointer;
                     min-height:40px;text-transform:none">
              Guardar comentario
            </button>
          </div>
        </div>
      </div>

      <!-- ACCIONES: siempre visibles -->
      ${!isEnt && !isNoEnt ? `
      <div class="mcard-actions" style="border-top:1px solid var(--border2)">
        ${isPend
          ? `<button class="btn btn-warn"
               onclick="salirDomicilio('${d.id}')">🚐 Salir</button>`
          : ''}
        ${isCam
          ? `<button class="btn btn-done-action"
               onclick="acabeDomicilio('${d.id}')">✓ ACABÉ</button>
             <button class="btn btn-danger"
               onclick="noPudeEntregar('${d.id}')">✕ No pude</button>`
          : ''}
      </div>` : ''}
      ${isNoEnt ? `
      <div class="mcard-actions" style="border-top:1px solid var(--border2)">
        <button class="btn btn-warn"
          onclick="reintentarEntrega('${d.id}')">🔄 Reintentar</button>
      </div>` : ''}
    </div>`;
}

window.toggleComentario = id => {
  const box = $(`com-box-${id}`);
  const btn = $(`btn-com-${id}`);
  if (!box || !btn) return;
  const open = box.style.display === 'none';
  box.style.display = open ? '' : 'none';
  btn.innerHTML = btn.innerHTML.replace(/[▾▴]/, open ? '▴' : '▾');
};

window.guardarComentario = async id => {
  const txt = $(`com-txt-${id}`)?.value?.trim() || '';
  try {
    await fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), { comentario: txt });
    const btn = $(`btn-com-${id}`);
    if (btn) {
      btn.innerHTML = txt
        ? '💬 Comentario <span style="color:var(--warn-tx)">●</span> ▴'
        : '💬 Agregar comentario ▴';
    }
  } catch(e) {
    alert('Error al guardar comentario.');
    console.error(e);
  }
};

window.toggleCard = id => {
  const detail  = document.getElementById('cd-' + id);
  const chevron = document.getElementById('ch-' + id);
  if (!detail) return;
  const isOpen = detail.style.display !== 'none';
  detail.style.display = isOpen ? 'none' : '';
  if (chevron) chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
};

window.toggleDomComentario = id => {
  const el  = document.getElementById('dom-cm-' + id);
  const btn = document.getElementById('btn-dcm-' + id);
  if (!el) return;
  const open = el.style.display === 'none';
  el.style.display = open ? '' : 'none';
  if (btn) btn.innerHTML = btn.innerHTML.replace(/[▾▴]/, open ? '▴' : '▾');
};

window.guardarDomComentario = async id => {
  const txt = document.getElementById('dom-txt-' + id)?.value?.trim() || '';
  if (!db) return;
  try {
    await fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), { comentario: txt });
    const btn = document.getElementById('btn-dcm-' + id);
    if (btn) btn.innerHTML = txt
      ? '💬 Comentario <span style="color:var(--warn-tx)">●</span> ▴'
      : '💬 Agregar comentario ▴';
    const box = document.getElementById('dom-cm-' + id);
    if (box) box.style.display = 'none';
  } catch(e) { console.error('guardarDomComentario:', e); }
};

function applyDark(on) {
  document.body.classList.toggle('dark', on);
  const btn = $('theme-btn');
  if (btn) btn.textContent = on ? '☀️' : '🌙';
}

window.toggleDark = () => {
  const isDark = document.body.classList.contains('dark');
  applyDark(!isDark);
  localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark');
};

   ACCIONES
═══════════════════════════════════ */
window.irEnCamino = async (id, dest) => {
  const btn = document.querySelector(`#mc-${id} .btn-warn`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Actualizando…'; }
  const update = {
    status:     'en_camino',
    enCaminoAt: Date.now(),
    paradero:   `En camino a ${dest} — ${nowTime()}`
  };
  try {
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), update);
    getGPS().then(gps => {
      if (gps) fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), { location_start: gps });
    }).catch(() => {});
    const idx = cachedList.findIndex(v => v.id === id);
    if (idx !== -1) { cachedList[idx] = { ...cachedList[idx], ...update }; renderCombined(); }
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '🚐 En camino'; }
  }
};

window.completarVuelta = async id => {
  const btn = document.querySelector(`#mc-${id} .btn-done-action`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Guardando…'; }
  const update = {
    status:      'done',
    completedAt: Date.now(),
    date:        today(),
    paradero:    '',
    emergency:   false
  };
  try {
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), update);
    getGPS().then(gps => {
      if (gps) fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), { location_end: gps });
    }).catch(() => {});
    const idx = cachedList.findIndex(v => v.id === id);
    if (idx !== -1) { cachedList[idx] = { ...cachedList[idx], ...update }; renderCombined(); }
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '✓ ACABÉ'; }
  }
};

window.tomarFoto = id => {
  fotoVueltaId = id;
  const inp = $('foto-input');
  inp.value = '';
  inp.click();
};

window.tomarFotoGaleria = id => {
  fotoVueltaId = id;
  const inp = $('foto-input-galeria');
  inp.value = '';
  inp.click();
};

window.uploadFoto = async input => {
  const file = input.files[0];
  if (!file || !fotoVueltaId) return;
  const id  = fotoVueltaId;
  fotoVueltaId = null;
  const btns = Array.from(document.querySelectorAll(`#mc-${id} .btn-foto`));
  btns.forEach(b => { b.disabled = true; });
  if (btns[0]) btns[0].textContent = '⏳ Subiendo…';
  try {
    const path    = `vueltas/${id}/${Date.now()}_${currentDriverUid}.jpg`;
    const storRef = storageMod.ref(storage, path);
    await storageMod.uploadBytes(storRef, file);
    const url = await storageMod.getDownloadURL(storRef);
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), {
      photos: fbMod.arrayUnion(url)
    });
  } catch(e) {
    console.error(e);
    alert('Error al subir la foto. Intenta de nuevo.');
    const resBtns = Array.from(document.querySelectorAll(`#mc-${id} .btn-foto`));
    resBtns.forEach(b => { b.disabled = false; });
    if (resBtns[0]) resBtns[0].textContent = '📷 Cámara';
    if (resBtns[1]) resBtns[1].textContent = '🖼 Galería';
  }
};

window.revertirVuelta = async id => {
  try {
    await fbMod.updateDoc(fbMod.doc(db, COLLECTION, id), {
      status:      'en_camino',
      completedAt: null
    });
  } catch(e) { console.error(e); }
};

═══════════════════════════════════ */
window.salirDomicilio = async id => {
  const btn = document.querySelector(`#mc-${id} .btn-warn`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Saliendo…'; }
  try {
    const update = { status: 'en_camino', enCaminoAt: Date.now() };
    await fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), update);
    getGPS().then(gps => {
      if (gps) fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), { gpsInicio: gps });
    }).catch(() => {});
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '🚐 Salir'; }
  }
};

window.acabeDomicilio = async id => {
  const btn = document.querySelector(`#mc-${id} .btn-done-action`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Guardando…'; }
  const d = cachedDomicilios.find(x => x.id === id);
  try {
    const update = { status: 'entregado', completadoAt: Date.now(), date: today() };
    await fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), update);
    getGPS().then(gps => {
      if (gps) fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), { gpsFin: gps });
    }).catch(() => {});
    notify('📦 Entrega completada', `${currentDriver} entregó a ${d?.cliente || ''}`);
    if (d && WHATSAPP_GROUP) {
      const hora = new Date().toLocaleTimeString('es-SV',
        { hour:'2-digit', minute:'2-digit', hour12:false });
      const msg = encodeURIComponent(
        `✅ Entrega completada\nCliente: ${d.cliente || '—'}\n` +
        `Tel: ${d.telefono || '—'}\nDirección: ${d.direccion || '—'}\n` +
        `Monto: $${d.total || '0'} · ${d.formaPago || '—'}\n` +
        `Motorista: ${currentDriver}\n🕐 ${hora}`
      );
      window.open(`https://wa.me/${WHATSAPP_GROUP}?text=${msg}`, '_blank');
    }
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '✓ ACABÉ'; }
  }
};

window.reintentarEntrega = async id => {
  try {
    await fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), {
      status:          'en_camino',
      motivoNoEntrega: '',
      fechaReagenda:   '',
      enCaminoAt:      Date.now()
    });
  } catch(e) { console.error(e); }
};

window.noPudeEntregar = id => {
  noEntregaId     = id;
  noEntregaMotivo = '';
  $('ne-opciones').innerHTML = MOTIVOS_NE.map((m, i) =>
    `<button class="ne-opt" id="ne-opt-${i}" onclick="selectNEMotivo(${i},'${escAttr(m)}')">${m}</button>`
  ).join('');
  $('ne-reagenda').style.display = 'none';
  $('ne-fecha').value = '';
  $('btn-confirmar-ne').disabled = false;
  $('modal-noentrega').style.display = '';
};

window.selectNEMotivo = (idx, motivo) => {
  noEntregaMotivo = motivo;
  document.querySelectorAll('.ne-opt').forEach((b, i) => b.classList.toggle('ne-sel', i === idx));
  $('ne-reagenda').style.display = motivo === 'Cliente reagendó' ? '' : 'none';
};

window.confirmarNoEntrega = async () => {
  if (!noEntregaMotivo) { alert('Selecciona un motivo'); return; }
  const btn = $('btn-confirmar-ne');
  btn.disabled = true;
  const d = cachedDomicilios.find(x => x.id === noEntregaId);
  const fechaReagenda = $('ne-fecha').value || '';
  try {
    await fbMod.updateDoc(fbMod.doc(db, 'domicilios', noEntregaId), {
      status: 'no_entregado',
      motivoNoEntrega: noEntregaMotivo,
      fechaReagenda
    });
    closeNoEntregaModal();
    if (d) {
      const msg = encodeURIComponent(
        `🚨 Entrega pendiente\nCliente: ${d.cliente}\nTel: ${d.telefono}\nMotivo: ${noEntregaMotivo}\nDirección: ${d.direccion}`
      );
      window.open(`https://wa.me/${WHATSAPP_GROUP}?text=${msg}`, '_blank');
    }
  } catch(e) {
    console.error(e);
    alert('Error al guardar');
    btn.disabled = false;
  }
};

window.closeNoEntregaModal = (e) => {
  if (e && e.target !== e.currentTarget) return;
  $('modal-noentrega').style.display = 'none';
  noEntregaId = null; noEntregaMotivo = '';
};

window.tomarFotoDom = id => {
  fotoDomId = id;

};

window.tomarFotoDomGaleria = id => {

};

window.elegirDeGaleria = id => {

window.uploadFotoDom = async input => {
  const file = input.files[0];
  if (!file || !fotoDomId) return;
  const id  = fotoDomId;

  const btns = Array.from(document.querySelectorAll(`#mc-${id} .btn-foto`));
  btns.forEach(b => { b.disabled = true; });
  if (btns[0]) btns[0].textContent = '⏳ Subiendo…';
  try {
    const path    = `domicilios/${id}/${Date.now()}_${currentDriverUid}.jpg`;
    const storRef = storageMod.ref(storage, path);
    await storageMod.uploadBytes(storRef, file);
    const url = await storageMod.getDownloadURL(storRef);
    await fbMod.updateDoc(fbMod.doc(db, 'domicilios', id), { photos: fbMod.arrayUnion(url) });
  } catch(e) {
    console.error(e);
    alert('Error al subir la foto. Intenta de nuevo.');
    const resBtns = Array.from(document.querySelectorAll(`#mc-${id} .btn-foto`));
    resBtns.forEach(b => { b.disabled = false; });
    if (resBtns[0]) resBtns[0].textContent = '📷 Cámara';
    if (resBtns[1]) resBtns[1].textContent = '🖼 Galería';
  }
};

/* ═══════════════════════════════════
   UTILS
═══════════════════════════════════ */
window.toggleDir = el => el.classList.toggle('open');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s)
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,"\\'");
}
